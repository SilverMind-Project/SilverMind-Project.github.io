name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Claude Code hooks committed under .claude/hooks/ (post-edit, stop scan).
      - name: Claude Code hook tests
        run: npm run hooks:test

      # A page with an em-dash never deploys.
      - name: Markdown has no em-dashes
        run: make check-md

      # Public counts (MCP tools, step types, channels) must match cognitive-companion's exported
      # vocabularies on its main branch; the unit tests prove the check can fail.
      - name: Count check unit tests
        run: npm test

      - name: Public counts match the code
        run: npm run docs:check-counts

      - name: Build documentation
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
